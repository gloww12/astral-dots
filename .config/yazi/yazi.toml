[opener]
nvim = [
  { run = '''nvim "$@"''', desc = "Neovim" }
]
html = [
  { run = '''firefox "$@"''', desc = "Firefox" }
]
fiji = [
  { run = '''fiji "$@"''', desc = "Fiji" }
]
image = [
  { run = '''feh "$@"''', desc = 'feh' }
]
gwen = [
  { run = '''gwenview "$@"''', desc = 'gwen' }
]
zath = [
  { run = '''zathura "$@"''', desc = 'Zathura' }
]
zath_alt = [
  { run = '''azath "$@"''', desc = 'Zathura (no theming)' }
]
mpv = [
  { run = '''mpv "$@"''', desc = 'mpv'}
]

[open]
prepend_rules = [
  { url = "*.tif", use = "fiji" },
  { url = "*.html", use = ["html", "edit"] },
  { url = '*.czi', use = 'fiji' },
  { url = '*.png', use = ['image', 'gwen'] },
  { url = '*.jpg', use = ['image', 'gwen'] },
  { url = '*.pdf', use = ['zath', 'zath_alt'] },
  { url = '*.webm', use = 'mpv' },
]

[plugin]
prepend_previewers = [
  { name = "*.md", run = "glow" },
]
