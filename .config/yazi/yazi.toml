[opener]
html = [
  { run = "firefox $@", desc = "Firefox" },
  { run = "nvim $@", desc = "Neovim" }
]
fiji = [
  { run = "fiji $@", desc = "Fiji" }
]
image = [
  { run = 'gwenview $@', desc = 'gwen'}
]
zath = [
  { run = 'zathura $@', desc = 'Zathura'}
]

[open]
prepend_rules = [
  { url = "*.tif", use = "fiji" },
  { url = "*.html", use = ["html", "edit"] },
  { url = '*.czi', use = 'fiji' },
  { url = '*.png', use = 'image' },
  { url = '*.jpg', use = 'image' },
  { url = '*.pdf', use = 'zath' },
]

[plugin]
prepend_previewers = [
  { name = "*.md", run = "glow" },
]
