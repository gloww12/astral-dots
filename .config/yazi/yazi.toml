[opener]
nvim = [
  { run = 'nvim %s', desc = 'Neovim' }
]
firefox = [
  { run = 'firefox %s', desc = 'Firefox' }
]
fiji = [
  { run = 'fiji %s', desc = 'Fiji' }
]
image = [
  { run = 'feh %s', desc = 'feh' }
]
gwen = [
  { run = 'gwenview %s', desc = 'gwen' }
]
zath = [
  { run = 'zathura %s', desc = 'Zathura' }
]
zath_alt = [
  { run = 'azath %s', desc = 'Zathura (no theming)' }
]
mpv = [
  { run = 'mpv %s', desc = 'mpv'}
]
play = [
  { run = 'play %s', desc = 'play'}
]
audacity = [
  { run = 'audacity %s', desc = 'audacity'}
]

[open]
prepend_rules = [
  { url = '*.tif', use = 'fiji' },
  { url = '*.html', use = ['firefox', 'edit'] },
  { url = '*.czi', use = 'fiji' },
  { url = '*.png', use = ['image', 'gwen'] },
  { url = '*.jpg', use = ['image', 'gwen'] },
  { url = '*.pdf', use = ['zath', 'zath_alt', 'firefox'] },
  { url = '*.webm', use = 'mpv' },
  { url = '*.mp4', use = 'mpv' },
  { url = '*.mp3', use = ['play', 'audacity'] },
]
