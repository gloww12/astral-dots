$mainMod = SUPER
$term = kitty
$menu = rofi -show drun
$coco = feh /home/glow/wall/coconut.jpg

# apps
bind = ALT, Return, exec, $term
bind = CONTROL_ALT, T, exec, $term
bind = , XF86AudioMedia, exec, $term -d ~/.dots nvim
bind = , F12, exec, $term -d ~/.dots nvim
bind = SHIFT, XF86AudioMedia, exec, $term -d ~/Documents/job/staph-code nvim
bind = CONTROL, XF86AudioMedia, exec, $term -d ~/Documents/obsidian/uni nvim

bind = $mainMod_SHIFT, A, exec, termspace.sh 21
bind = $mainMod_SHIFT, B, exec, termspace.sh 16
bind = $mainMod_SHIFT, C, exec, $coco
bind = $mainMod_SHIFT, D, exec, termspace.sh 13
bind = $mainMod_SHIFT, F, exec, thunar
bind = $mainMod_SHIFT, G, exec, termspace.sh 22
bind = $mainMod_SHIFT, M, exec, proton-mail
bind = $mainMod_SHIFT, N, exec, termspace.sh 17
bind = $mainMod_SHIFT, O, exec, termspace.sh 18
bind = $mainMod_SHIFT, P, exec, termspace.sh 15
bind = $mainMod_SHIFT, Q, exec, qbittorrent
bind = $mainMod_SHIFT, R, exec, $term -d ~/Pictures/reaction yazi
bind = $mainMod_SHIFT, S, exec, strawberry
bind = $mainMod_SHIFT, T, exec, termspace.sh 12
bind = $mainMod_SHIFT, V, exec, termspace.sh 19
bind = $mainMod_SHIFT, Y, exec, termspace.sh 14
bind = $mainMod_SHIFT, Z, exec, termspace.sh 20

# rofi
# bind = $mainMod, B, exec, rofi-bluetooth
bind = $mainMod, A, exec, ~/.config/rofi/binds.sh
bind = $mainMod, B, exec, ~/.config/hypr/scripts/bat.sh
bind = $mainMod, C, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = $mainMod, D, exec, $menu
bind = $mainMod, E, exec, rofimoji
# bind = $mainMod, F, exec, rofi -show file-browser-extended
bind = $mainMod, I, exec, ~/.config/hypr/scripts/toggleidle.sh
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, G, exec, ~/.config/hypr/scripts/paper.sh
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, N, exec, ~/.config/hypr/scripts/togglednd.sh
bind = $mainMod, O, exec, hyprctl dispatch setprop active opaque toggle
bind = $mainMod, P, exec, hyprpicker --autocopy
bind = $mainMod, Q, killactive, 
bind = $mainMod, R, layoutmsg, togglesplit
bind = $mainMod, S, exec, ~/.config/hypr/scripts/togglesunset.sh
bind = $mainMod, T, togglefloating 
bind = $mainMod, U, exec, rofi-rbw
bind = $mainMod, V, exec, ~/.config/hypr/scripts/togglevpn.sh
bind = $mainMod, W, exec, ~/.config/hypr/scripts/togglebar.sh
bind = $mainMod, Y, exec, ~/.config/hypr/scripts/toggledeco.sh
bind = $mainMod, Z, exec, hyprmag


bind = $mainMod_CONTROL, S, exec, hyprsunset -t 6000
bind = $mainMod_CONTROL, L, exec, hyprlock
bind = $mainMod_CONTROL, C, exec, ~/.config/hypr/scripts/togglecaps.sh
bind = $mainMod_CONTROL, Q, forcekillactive

# power menu
bind = , XF86PowerOff,  exec, ~/.config/rofi/powermenu.sh
bind = CONTROL, Delete, exec, ~/.config/rofi/powermenu.sh

#Functions
bind = , XF86AudioLowerVolume,  exec, pamixer -d 5
bind = , XF86AudioRaiseVolume,  exec, pamixer -i 5
bind = , XF86AudioMute,         exec, pamixer -t

# multimedia
bind = , XF86AudioPlay,     exec, playerctl play-pause
bind = , Pause,             exec, playerctl play-pause
bind = , XF86AudioPause,    exec, playerctl play-pause
bind = , XF86AudioNext,     exec, playerctl next
bind = CONTROL, Page_Up ,   exec, playerctl next
bind = , XF86AudioPrev,     exec, playerctl previous
bind = CONTROL, Page_Down,  exec, playerctl previous

bind = SHIFT, XF86AudioPlay,  exec, playerctl play-pause
bind = SHIFT, XF86AudioPause, exec, playerctl play-pause
bind = SHIFT, XF86AudioNext,  exec, playerctl next
bind = SHIFT, XF86AudioPrev,  exec, playerctl previous

# screenshot
bind = SHIFT, Print,    exec, slurp | grim -c -g - - | swappy -f -
bind = , Print,         exec, slurp | grim -c -g - - | wl-copy
bind = CONTROL, Print,  exec, grim -c - | wl-copy

# brightness
bind = , XF86MonBrightnessUp,   exec, brightnessctl s +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

bind = SHIFT, XF86MonBrightnessUp,   exec, brightnessctl s +1%
bind = SHIFT, XF86MonBrightnessDown, exec, brightnessctl s 1%-

bind = CONTROL, XF86MonBrightnessUp,   exec, brightnessctl s +20%
bind = CONTROL, XF86MonBrightnessDown, exec, brightnessctl s 20%-

# explode
bind = $mainMod_SHIFT_CONTROL_ALT, K, exit

#misc
bindl=,switch:Lid Switch,exec,  hyprlock -c /home/glow/.config/hypr/hyprlock-login.conf

# hyprland binds
# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# move window binds
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# hidden workspaces
bind = $mainMod, Tab,     exec, termspace.sh 11
bind = $mainMod, Escape,  exec, termspace.sh 14
bind = $mainMod, Space,   exec, termspace.sh 15
bind = $mainMod_SHIFT, Tab,     movetoworkspace, 11
bind = $mainMod_SHIFT, Escape,  movetoworkspace, 14
bind = $mainMod_SHIFT, Space,   movetoworkspace, 15

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod_SHIFT, 1, movetoworkspace, 1
bind = $mainMod_SHIFT, 2, movetoworkspace, 2
bind = $mainMod_SHIFT, 3, movetoworkspace, 3
bind = $mainMod_SHIFT, 4, movetoworkspace, 4
bind = $mainMod_SHIFT, 5, movetoworkspace, 5
bind = $mainMod_SHIFT, 6, movetoworkspace, 6
bind = $mainMod_SHIFT, 7, movetoworkspace, 7
bind = $mainMod_SHIFT, 8, movetoworkspace, 8
bind = $mainMod_SHIFT, 9, movetoworkspace, 9
bind = $mainMod_SHIFT, 0, movetoworkspace, 10
bind = $mainMod_SHIFT, Tab, movetoworkspace, 11

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

binde = $mainMod, Up, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.1')
binde = $mainMod, Down, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.9) | if . < 1 then 1 else . end')
bind = $mainMod_CONTROL, Down, exec, hyprctl -q keyword cursor:zoom_factor 1

# :^)
bindr = $mainMod_ALT, ALT_L, exec, $coco
# bindr = $mainMod_SHIFT, SHIFT_L, exec, feh /home/glow/wall/coconut.jpg
bind = ALT, Tab, exec, $coco
bind = ALT, XF86AudioPrev, exec, $coco
bind = CONTROL_ALT, Delete, exec, $coco
