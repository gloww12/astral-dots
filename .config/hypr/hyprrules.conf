# Example windowrule v1
# windowrule = float, ^(kitty)$

windowrule = match:class ^(kitty), opacity 0.8
windowrule = match:class ^(.*qBittorrent)$, opacity 0.8
windowrule = match:class ^(obsidian)$, opacity 0.8
windowrule = match:class ^(.*zathura)$, opacity 0.8
windowrule = match:class ^.*[Ss]trawberry.*$, opacity 0.8
windowrule = match:class ^(VSCodium)$, opacity 0.8
windowrule = match:class ^(jetbrains-idea)$, opacity 0.8
# windowrule = match:class ^(vesktop)$, opacity 0.8
windowrule = match:class ^(Thunar)$, opacity 0.8
windowrule = match:class ^(steam)$, opacity 0.8
windowrule = match:class ^(love)$, opacity 0.8
windowrule = match:class ^(LibreWolf)$, opacity 0.8
windowrule = match:class ^(Spotify)$, opacity 0.8
windowrule = match:class ^(dev.zed.Zed), opacity 0.8

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# windowrulev2 = nomaximizerequest, class:.* # You'll probably like this.
windowrulev2 = opacity 0.0 override, class:^(xwaylandvideobridge)$
windowrulev2 = noanim, class:^(xwaylandvideobridge)$
windowrulev2 = noinitialfocus, class:^(xwaylandvideobridge)$
windowrulev2 = maxsize 1 1, class:^(xwaylandvideobridge)$
windowrulev2 = noblur, class:^(xwaylandvideobridge)$
windowrulev2 = float,class:^(Rofi)$
