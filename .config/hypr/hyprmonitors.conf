# monitor
monitorv2 { # internal
  output = eDP-1
  mode = 2256x1504@60
  position = 168x1080
  scale = 1.175
}
monitorv2 { # top left
  output = DP-2
  mode = 1920x1080@144
  position = 0x0
  scale = 1
}
monitorv2 { # top right
  output = DP-1
  mode = 1920x1080@100
  sdrsaturation = 1.5
  position = 1920x0
  scale = 1
}

# workspaces
workspace = 1, monitor:DP-2, default:true
workspace = 2, monitor:DP-2
workspace = 3, monitor:DP-2
workspace = 4, monitor:DP-2

workspace = 5, monitor:DP-1, default:true
workspace = 6, monitor:DP-1
workspace = 7, monitor:DP-1
workspace = 8, monitor:DP-1

workspace = 9,  monitor:eDP-1, default:true
workspace = 10, monitor:eDP-1


workspace = 11, on-created-empty:kitty
workspace = 12, on-created-empty:tidal-hifi # music
workspace = 13, on-created-empty:vesktop # discord
